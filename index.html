<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Challenge Quest</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        fontFamily: {
          sans: ['Inter', 'sans-serif']
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 font-sans text-gray-900 min-h-screen">
  <div class="container mx-auto px-6 lg:px-12 py-8">
    <header class="mb-8">
      <h1 class="text-3xl font-semibold leading-tight text-center">Family Challenge Quest</h1>
    </header>
    <nav role="tablist" class="flex space-x-2 overflow-x-auto mb-6">
      <button role="tab" aria-controls="game-tab" aria-selected="true" data-tab="game" onclick="showTab('game')" class="flex-1 px-6 py-2 rounded-full font-medium transition-all duration-300 bg-blue-600 text-white shadow-sm">Game</button>
      <button role="tab" aria-controls="edit-tab" aria-selected="false" data-tab="edit" onclick="showTab('edit')" class="flex-1 px-6 py-2 rounded-full font-medium transition-all duration-300 bg-white text-gray-700 border border-gray-300 hover:bg-gray-50">Edit</button>
      <button role="tab" aria-controls="leaderboard-tab" aria-selected="false" data-tab="leaderboard" onclick="showTab('leaderboard')" class="flex-1 px-6 py-2 rounded-full font-medium transition-all duration-300 bg-white text-gray-700 border border-gray-300 hover:bg-gray-50">Leaderboard</button>
    </nav>
    <main>
      <section id="game-tab" class="tab-content bg-white rounded-2xl shadow-md p-6">
        <h2 class="text-xl font-medium mb-4">Current Round</h2>
        <div id="instructions" class="text-base text-gray-700 leading-relaxed mb-4"></div>
        <div id="game-round" class="mb-6"></div>
        <div class="flex space-x-4 mb-6">
          <button onclick="revealCard()" class="bg-blue-600 hover:bg-blue-700 text-white rounded-full px-6 py-2 shadow-sm transition-colors duration-300">Reveal Hint</button>
          <button onclick="nextPlayer()" class="bg-blue-600 hover:bg-blue-700 text-white rounded-full px-6 py-2 shadow-sm transition-colors duration-300">Next Player</button>
        </div>
        <div id="scoreboard" class="space-y-2"></div>
      </section>
      <section id="edit-tab" class="tab-content hidden bg-white rounded-2xl shadow-md p-6">
        <h2 class="text-xl font-medium mb-4">Game Setup</h2>
        <div id="player-config" class="space-y-2 mb-4"></div>
        <button onclick="addPlayer()" class="bg-blue-600 hover:bg-blue-700 text-white rounded-full px-6 py-2 shadow-sm transition-colors duration-300 mb-4">Add Player</button>
        <textarea id="encodedInput" placeholder="Paste AI-generated game code here..." class="w-full h-40 p-4 border border-gray-300 rounded-md mb-4"></textarea>
        <button onclick="loadGameData()" class="bg-blue-600 hover:bg-blue-700 text-white rounded-full px-6 py-2 shadow-sm transition-colors duration-300">Load Game Data</button>
      </section>
      <section id="leaderboard-tab" class="tab-content hidden bg-white rounded-2xl shadow-md p-6">
        <h2 class="text-xl font-medium mb-4">Leaderboard</h2>
        <div id="final-scores" class="space-y-2"></div>
      </section>
    </main>
  </div>
  <script>
    const STATE = {
      players: [],
      scores: {},
      rounds: [],
      currentPlayerIndex: 0,
      currentTab: 'game',
    };

    function showTab(tabId) {
      STATE.currentTab = tabId;
      document.querySelectorAll('[role="tab"]').forEach(btn => {
        const isActive = btn.dataset.tab === tabId;
        btn.setAttribute('aria-selected', isActive);
        if (isActive) {
          btn.classList.add('bg-blue-600', 'text-white');
          btn.classList.remove('bg-white', 'text-gray-700', 'border', 'border-gray-300', 'hover:bg-gray-50');
        } else {
          btn.classList.add('bg-white', 'text-gray-700', 'border', 'border-gray-300', 'hover:bg-gray-50');
          btn.classList.remove('bg-blue-600', 'text-white');
        }
      });
      document.querySelectorAll('.tab-content').forEach(tab => {
        tab.classList.toggle('hidden', tab.id !== `${tabId}-tab`);
      });
      if (tabId === 'game') {
        renderRound();
        renderScoreboard();
      } else if (tabId === 'leaderboard') {
        renderLeaderboard();
      }
    }

    function addPlayer() {
      const container = document.getElementById('player-config');
      const input = document.createElement('input');
      input.classList.add('w-full', 'p-2', 'border', 'border-gray-300', 'rounded-md');
      input.placeholder = 'Player name';
      input.addEventListener('change', updatePlayers);
      container.appendChild(input);
    }

    function updatePlayers() {
      STATE.players = Array.from(document.querySelectorAll('#player-config input'))
        .map(input => input.value.trim())
        .filter(name => name);
      STATE.players.forEach(p => {
        if (!(p in STATE.scores)) STATE.scores[p] = 0;
      });
    }

    function loadGameData() {
      const input = document.getElementById('encodedInput').value.trim();
      if (!input.startsWith('[ FQDATA_v1 ]')) return alert('Invalid format');
      const encoded = input.split(']')[1].trim();
      const xorKey = 'FQKEY';
      let decoded;
      try {
        decoded = atob(encoded);
      } catch (e) {
        return alert('Invalid base64 encoding');
      }
      let output = '';
      for (let i = 0; i < decoded.length; i++) {
        output += String.fromCharCode(decoded.charCodeAt(i) ^ xorKey.charCodeAt(i % xorKey.length));
      }
      try {
        STATE.rounds = JSON.parse(output);
        alert('✅ Game data loaded!');
        startGame();
      } catch (e) {
        alert('❌ Failed to decode game data');
      }
    }

    function startGame() {
      STATE.currentPlayerIndex = 0;
      showTab('game');
    }

    function renderRound() {
      if (STATE.players.length === 0 || STATE.rounds.length === 0) return;
      const round = STATE.rounds[STATE.currentPlayerIndex % STATE.rounds.length];
      const roundBox = document.getElementById('game-round');
      const instructions = document.getElementById('instructions');
      const currentPlayer = STATE.players[STATE.currentPlayerIndex % STATE.players.length];
      instructions.textContent = `Everyone else, look away. ${currentPlayer}, click when ready.`;
      roundBox.innerHTML = '';
      const card = document.createElement('div');
      card.classList.add('bg-white', 'rounded-2xl', 'shadow-md', 'p-6', 'text-center', 'text-gray-500', 'cursor-pointer', 'transition-shadow', 'duration-300', 'hover:shadow-lg');
      card.textContent = '[Click to reveal card]';
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');
      card.setAttribute('aria-label', 'Reveal card');
      const reveal = () => {
        card.textContent = round.content;
        card.classList.remove('text-gray-500', 'cursor-pointer', 'hover:shadow-lg');
        card.classList.add('text-gray-900');
        card.removeAttribute('role');
        card.removeAttribute('tabindex');
        card.removeAttribute('aria-label');
        card.removeEventListener('click', reveal);
        card.removeEventListener('keydown', keyHandler);
      };
      const keyHandler = (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          reveal();
          e.preventDefault();
        }
      };
      card.addEventListener('click', reveal);
      card.addEventListener('keydown', keyHandler);
      roundBox.appendChild(card);
    }

    function revealCard() {
      if (STATE.players.length === 0 || STATE.rounds.length === 0) return;
      const round = STATE.rounds[STATE.currentPlayerIndex % STATE.rounds.length];
      const currentPlayer = STATE.players[STATE.currentPlayerIndex % STATE.players.length];
      alert(`Hint for ${currentPlayer}:\n${round.content}`);
    }

    function nextPlayer() {
      STATE.currentPlayerIndex++;
      renderRound();
      renderScoreboard();
    }

    function renderScoreboard() {
      const board = document.getElementById('scoreboard');
      board.innerHTML = '';
      STATE.players.forEach(p => {
        const row = document.createElement('div');
        row.classList.add('flex', 'justify-between', 'items-center', 'p-4', 'bg-white', 'rounded-lg', 'shadow-sm');
        row.innerHTML = `<span class="text-base text-gray-700">${p}: ${STATE.scores[p]} pts</span>`;
        const plus = document.createElement('button');
        plus.classList.add('bg-blue-600', 'hover:bg-blue-700', 'text-white', 'rounded-full', 'px-4', 'py-1', 'shadow-sm', 'transition-colors', 'duration-300');
        plus.textContent = '+';
        plus.onclick = () => {
          STATE.scores[p]++;
          renderScoreboard();
        };
        row.appendChild(plus);
        board.appendChild(row);
      });
    }

    function renderLeaderboard() {
      const finalScores = document.getElementById('final-scores');
      finalScores.innerHTML = '';
      const sorted = [...STATE.players].sort((a, b) => STATE.scores[b] - STATE.scores[a]);
      sorted.forEach(p => {
        const row = document.createElement('div');
        row.classList.add('flex', 'justify-between', 'items-center', 'p-4', 'bg-white', 'rounded-lg', 'shadow-sm');
        row.innerHTML = `<span class="text-base text-gray-700 font-medium">${p}</span> <span>${STATE.scores[p]} pts</span>`;
        finalScores.appendChild(row);
      });
    }

    window.addEventListener('load', () => {
      const tablist = document.querySelector('[role="tablist"]');
      tablist.addEventListener('keydown', (e) => {
        const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
        const index = tabs.indexOf(document.activeElement);
        if (index === -1) return;
        let nextIndex;
        if (e.key === 'ArrowRight') {
          nextIndex = (index + 1) % tabs.length;
        } else if (e.key === 'ArrowLeft') {
          nextIndex = (index - 1 + tabs.length) % tabs.length;
        } else {
          return;
        }
        tabs[nextIndex].focus();
        showTab(tabs[nextIndex].dataset.tab);
        e.preventDefault();
      });

      addPlayer();
      addPlayer();
      const inputs = document.querySelectorAll('#player-config input');
      inputs[0].value = 'Player 1';
      inputs[1].value = 'Player 2';
      updatePlayers();
      const defaultData = '[ FQDATA_v1 ] HSppJjYoJS4rLWRra2cYJSVrKiwycSplNCk/ICAgZCxnZSJkMiQrLSM/P2djZnMPNzgxcSplMSkkOCB7O31rPnslPiUxPCglaX95ZAIiKz5mMGs2Nig2aTgE';
      document.getElementById('encodedInput').value = defaultData;
      loadGameData();
    });
  </script>
</body>
</html>
