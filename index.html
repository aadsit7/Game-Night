<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codenames - Digital Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            inter: ['Inter', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="bg-gradient-to-br from-gray-50 to-blue-50 font-inter text-gray-900 min-h-screen">
  <header class="bg-white/80 backdrop-blur-md shadow-lg sticky top-0 z-50">
    <div class="container mx-auto px-6 py-4">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <h1 class="text-3xl md:text-4xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">Codenames</h1>
        <div class="flex flex-wrap gap-3 justify-center md:justify-end">
          <button id="new-game-btn" class="px-6 py-2.5 bg-gradient-to-r from-green-500 to-green-600 text-white rounded-2xl shadow-lg hover:shadow-xl transition-all duration-300 font-medium flex items-center gap-2">
            <i data-lucide="refresh-cw"></i>
            New Game
          </button>
          <button id="spy-toggle-btn" class="px-6 py-2.5 bg-blue-500/80 hover:bg-blue-600 text-white rounded-2xl shadow-lg hover:shadow-xl transition-all duration-300 font-medium flex items-center gap-2">
            <i data-lucide="eye"></i>
            Spymaster View
          </button>
          <button id="fullscreen-toggle-btn" class="px-6 py-2.5 bg-purple-500/80 hover:bg-purple-600 text-white rounded-2xl shadow-lg hover:shadow-xl transition-all duration-300 font-medium flex items-center gap-2">
            <i data-lucide="maximize-2"></i>
            Fullscreen
          </button>
        </div>
      </div>
    </div>
  </header>
  <div id="fs-controls" class="hidden fixed top-6 left-1/2 transform -translate-x-1/2 z-50 bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-3 flex items-center gap-3 border border-gray-200">
    <button id="fs-spy-toggle" class="p-3 text-gray-700 hover:text-blue-600 rounded-2xl hover:bg-gray-100 transition-all duration-300" title="Spymaster View" aria-label="Toggle Spymaster View">
      <i data-lucide="eye" class="w-5 h-5"></i>
    </button>
    <button id="fs-new-game" class="p-3 text-gray-700 hover:text-green-600 rounded-2xl hover:bg-gray-100 transition-all duration-300" title="New Game" aria-label="Start New Game">
      <i data-lucide="refresh-cw" class="w-5 h-5"></i>
    </button>
    <div class="w-px h-8 bg-gray-300"></div>
    <button id="fs-exit" class="p-3 text-gray-700 hover:text-red-600 rounded-2xl hover:bg-gray-100 transition-all duration-300" title="Exit Fullscreen" aria-label="Exit Fullscreen">
      <i data-lucide="minimize-2" class="w-5 h-5"></i>
    </button>
  </div>
  <main class="container mx-auto px-4 md:px-6 py-12 max-w-6xl flex flex-col gap-12">
    <div id="game-over-banner" class="hidden mb-12 mx-auto max-w-2xl text-center">
      <div id="winner-display" class="text-4xl md:text-5xl font-black text-white px-12 md:px-20 py-8 md:py-12 rounded-3xl shadow-2xl mx-auto max-w-max mb-6 transform scale-105"></div>
      <button id="new-game-over-btn" class="px-8 py-4 bg-white/90 hover:bg-white text-gray-900 rounded-3xl shadow-xl hover:shadow-2xl transition-all duration-300 font-semibold text-lg flex items-center gap-3 mx-auto">
        <i data-lucide="play"></i>
        Play Again
      </button>
    </div>
    <div id="remaining-display" class="flex flex-col md:flex-row justify-center items-center gap-8 md:gap-16 mb-12">
      <div class="text-center p-6 bg-white/70 backdrop-blur-sm rounded-3xl shadow-xl">
        <div class="text-xl md:text-2xl font-bold text-red-600 mb-2">Red Team</div>
        <div id="red-remaining" class="text-4xl md:text-5xl font-black">9</div>
      </div>
      <div class="text-center p-6 bg-white/70 backdrop-blur-sm rounded-3xl shadow-xl">
        <div class="text-xl md:text-2xl font-bold text-blue-600 mb-2">Blue Team</div>
        <div id="blue-remaining" class="text-4xl md:text-5xl font-black">8</div>
      </div>
    </div>
    <div id="current-team-indicator" class="hidden mb-12 mx-auto max-w-max">
      <div class="text-2xl md:text-3xl font-black text-white px-12 md:px-16 py-6 md:py-8 rounded-3xl shadow-2xl transform scale-110"></div>
    </div>
    <div id="clue-section" class="bg-white/70 backdrop-blur-md rounded-3xl shadow-xl p-8 md:p-12 mb-12 max-w-2xl mx-auto hidden"></div>
    <div id="grid-wrapper" class="w-full">
      <div id="grid" class="grid grid-cols-5 gap-3 md:gap-4 max-w-5xl mx-auto"></div>
    </div>
  </main>
  <footer class="bg-white/50 backdrop-blur-md mt-auto pt-12 pb-6">
    <div class="container mx-auto px-6 text-center text-gray-500 text-sm">Digital Edition – Family Game Night Ready</div>
  </footer>
  <script>
    lucide.createIcons();
    const STATE = {
      words: [],
      colors: [],
      revealed: new Set(),
      currentTeam: 'red',
      remaining: { red: 9, blue: 8 },
      mode: 'clue',
      clue: null,
      spyView: false,
      fullscreen: false,
      gameOver: false,
      winner: null,
    };
    const WORDLIST = [
      "AFRICA", "AGENT", "AIR", "ALIEN", "ALPS", "AMAZON", "AMBULANCE", "AMERICA", "ANGEL", "ANTARCTICA",
      "APPLE", "ARM", "ATLANTIS", "AUSTRALIA", "AZTEC", "BACK", "BALL", "BAND", "BANK", "BAR",
      "BARK", "BAT", "BATTERY", "BEACH", "BEAR", "BEAT", "BED", "BEIJING", "BELL", "BELT",
      "BERLIN", "BERMUDA", "BERRY", "BILL", "BLOCK", "BOARD", "BOLT", "BOMB", "BOND", "BOOM",
      "BOOT", "BOTTLE", "BOW", "BOX", "BRIDGE", "BRUSH", "BUCK", "BUFFALO", "BUG", "BUGLE",
      "BUTTON", "CALF", "CANADA", "CAP", "CAPITAL", "CAR", "CARD", "CARROT", "CASINO", "CAST",
      "CAT", "CELL", "CENTAUR", "CENTER", "CHAIR", "CHANGE", "CHARGE", "CHECK", "CHEST", "CHICK",
      "CHINA", "CHOCOLATE", "CHURCH", "CIRCLE", "CLIFF", "CLOAK", "CLUB", "CODE", "COLD", "COMIC",
      "COMPOUND", "CONCERT", "CONDUCTOR", "CONTRACT", "COOK", "COPPER", "COTTON", "COURT", "COVER", "CRANE",
      "CRASH", "CRICKET", "CROSS", "CROWN", "CYCLE", "CZECH", "DANCE", "DATE", "DAY", "DEATH",
      "DECK", "DEGREE", "DIAMOND", "DICE", "DINOSAUR", "DISEASE", "DOCTOR", "DOG", "DRAFT", "DRAGON",
      "DRESS", "DRILL", "DROP", "DUCK", "DWARF", "EAGLE", "EGYPT", "EMBASSY", "ENGINE", "ENGLAND",
      "EUROPE", "EYE", "FACE", "FAIR", "FALL", "FAN", "FENCE", "FIELD", "FIGHTER", "FIGURE",
      "FILE", "FILM", "FIRE", "FISH", "FLUTE", "FLY", "FOOT", "FORCE", "FOREST", "FORK",
      "FRANCE", "GAME", "GAS", "GENIUS", "GERMANY", "GHOST", "GIANT", "GLASS", "GLOVE", "GOLD",
      "GRACE", "GRASS", "GREECE", "GREEN", "GROUND", "HAM", "HAND", "HAWK", "HEAD", "HEART",
      "HELICOPTER", "HIMALAYAS", "HOLE", "HOLLYWOOD", "HONEY", "HOOD", "HOOK", "HORN", "HORSE", "HORSESHOE",
      "HOSPITAL", "HOTEL", "ICE", "ICE CREAM", "INDIA", "IRON", "IVORY", "JACK", "JAM", "JET",
      "JUPITER", "KANGAROO", "KETCHUP", "KEY", "KID", "KING", "KIWI", "KNIFE", "KNIGHT", "LAB",
      "LAP", "LASER", "LAWYER", "LEAD", "LEMON", "LEPRECHAUN", "LIFE", "LIGHT", "LIMOUSINE", "LINE",
      "LINK", "LION", "LITTER", "LOCH NESS", "LOCK", "LOG", "LONDON", "LUCK", "MAIL", "MAMMOTH",
      "MAPLE", "MARBLE", "MARCH", "MASS", "MATCH", "MERCURY", "MEXICO", "MICROSCOPE", "MILLIONAIRE", "MINE",
      "MINT", "MISSILE", "MODEL", "MOLE", "MOON", "MOSCOW", "MOUNT", "MOUSE", "MOUTH", "MUG",
      "NAIL", "NEEDLE", "NET", "NEW YORK", "NIGHT", "NINJA", "NOTE", "NOVEL", "NURSE", "NUT",
      "OCTOPUS", "OIL", "OLIVE", "OLYMPUS", "OPERA", "ORANGE", "ORGAN", "PALM", "PAN", "PANTS",
      "PAPER", "PARACHUTE", "PARK", "PART", "PASS", "PASTE", "PENGUIN", "PHOENIX", "PIANO", "PIE",
      "PILOT", "PIN", "PIPE", "PIRATE", "PISTOL", "PIT", "PITCH", "PLANE", "PLASTIC", "PLATE",
      "PLATYPUS", "PLAY", "PLOT", "POINT", "POISON", "POLE", "POLICE", "POOL", "PORT", "POST",
      "POUND", "PRESS", "PRINCESS", "PUMPKIN", "PUPIL", "PYRAMID", "QUEEN", "RABBIT", "RACKET", "RAY",
      "REVOLUTION", "RING", "ROBIN", "ROBOT", "ROCK", "ROME", "ROOT", "ROSE", "ROULETTE", "ROUND",
      "ROW", "RULER", "SATELLITE", "SATURN", "SCALE", "SCHOOL", "SCIENTIST", "SCORPION", "SCREEN", "SCUBA DIVER",
      "SEAL", "SERVER", "SHADOW", "SHAKESPEARE", "SHARK", "SHIP", "SHOE", "SHOP", "SHOT", "SINK",
      "SKYSCRAPER", "SLIP", "SLUG", "SMUGGLER", "SNOW", "SNOWMAN", "SOCK", "SOLDIER", "SOUL", "SOUND",
      "SPACE", "SPELL", "SPIDER", "SPIKE", "SPINE", "SPOT", "SPRING", "SPY", "SQUARE", "STADIUM",
      "STAFF", "STAR", "STATE", "STICK", "STOCK", "STRAW", "STREAM", "STRIKE", "STRING", "SUB",
      "SUIT", "SUPERHERO", "SWING", "SWITCH", "TABLE", "TABLET", "TAG", "TAIL", "TAP", "TEACHER",
      "TELESCOPE", "TEMPLE", "THEATER", "THIEF", "THUMB", "TICK", "TIE", "TIME", "TOKYO", "TOOTH",
      "TORCH", "TOWER", "TRACK", "TRAIN", "TRIANGLE", "TRIP", "TRUNK", "TUBE", "TURKEY", "UNDERTAKER",
      "UNICORN", "VACUUM", "VAN", "VET", "WAKE", "WALL", "WAR", "WASHER", "WASHINGTON", "WATCH",
      "WATER", "WAVE", "WEB", "WELL", "WHALE", "WHIP", "WIND", "WITCH", "WORM", "YARD"
    ];
    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }
    function newGame() {
      STATE.words = shuffle([...WORDLIST]).slice(0, 25);
      const starterTeam = Math.random() < 0.5 ? 'red' : 'blue';
      const otherTeam = starterTeam === 'red' ? 'blue' : 'red';
      STATE.remaining = { red: starterTeam === 'red' ? 9 : 8, blue: starterTeam === 'blue' ? 9 : 8 };
      STATE.currentTeam = starterTeam;
      const positions = shuffle(Array.from({ length: 25 }, (_, i) => i));
      STATE.colors = Array(25).fill('neutral');
      STATE.colors[positions[0]] = 'assassin';
      let posIdx = 1;
      for (let i = 0; i < 9; i++) {
        STATE.colors[positions[posIdx++]] = starterTeam;
      }
      for (let i = 0; i < 8; i++) {
        STATE.colors[positions[posIdx++]] = otherTeam;
      }
      // remaining positions are neutral (7)
      STATE.revealed = new Set();
      STATE.mode = 'clue';
      STATE.clue = null;
      render();
    }
    function updateLayout() {
      const isFs = STATE.fullscreen;
      const body = document.body;
      const htmlEl = document.documentElement;
      const headerEl = document.querySelector('header');
      const footerEl = document.querySelector('footer');
      const mainEl = document.querySelector('main');
      const fsControls = document.getElementById('fs-controls');
      if (isFs) {
        body.classList.add('h-screen', 'overflow-hidden');
        htmlEl.classList.add('h-screen');
        headerEl.classList.add('hidden');
        footerEl.classList.add('hidden');
        mainEl.classList.remove('py-12', 'px-4', 'md:px-6', 'max-w-6xl', 'gap-12');
        mainEl.classList.add('h-full', 'p-8', 'md:p-12', 'lg:p-16', 'gap-8', 'md:gap-12', 'max-w-none');
        fsControls.classList.remove('hidden');
      } else {
        body.classList.remove('h-screen', 'overflow-hidden');
        htmlEl.classList.remove('h-screen');
        headerEl.classList.remove('hidden');
        footerEl.classList.remove('hidden');
        mainEl.classList.remove('h-full', 'p-8', 'md:p-12', 'lg:p-16', 'gap-8', 'md:gap-12', 'max-w-none');
        mainEl.classList.add('py-12', 'px-4', 'md:px-6', 'max-w-6xl', 'gap-12');
        fsControls.classList.add('hidden');
      }
    }
    function render() {
      lucide.createIcons();
      const isFs = STATE.fullscreen;
      updateLayout();
      // Game Over Banner
      const gameOverBanner = document.getElementById('game-over-banner');
      const winnerDisplay = document.getElementById('winner-display');
      if (STATE.gameOver) {
        gameOverBanner.classList.remove('hidden');
        const teamColor = STATE.winner === 'red' ? 'from-red-500 to-red-600' : 'from-blue-500 to-blue-600';
        const sizeClasses = isFs ? 'text-6xl md:text-8xl px-24 md:px-32 py-16 md:py-20' : 'text-4xl md:text-5xl px-12 md:px-20 py-8 md:py-12';
        winnerDisplay.className = `font-black text-white ${sizeClasses} rounded-3xl shadow-2xl mx-auto max-w-max mb-6 bg-gradient-to-r ${teamColor} transform scale-105`;
        winnerDisplay.textContent = `${STATE.winner.toUpperCase()} TEAM WINS! 🎉`;
      } else {
        gameOverBanner.classList.add('hidden');
      }
      // Remaining Display
      const remSize = isFs ? 'text-5xl md:text-7xl p-8 md:p-12 gap-12 md:gap-20' : 'text-4xl md:text-5xl p-6 gap-8 md:gap-16';
      const remDivSize = isFs ? 'text-2xl md:text-4xl p-8 rounded-3xl' : 'text-xl md:text-2xl p-6 rounded-3xl';
      document.getElementById('remaining-display').className = `flex flex-col md:flex-row justify-center items-center ${remSize} bg-white/70 backdrop-blur-sm shadow-xl mb-0`;
      document.querySelector('#remaining-display > div:nth-child(1)').className = `text-center ${remDivSize}`;
      document.querySelector('#remaining-display > div:nth-child(2)').className = `text-center ${remDivSize}`;
      document.getElementById('red-remaining').textContent = STATE.remaining.red;
      document.getElementById('blue-remaining').textContent = STATE.remaining.blue;
      // Current Team Indicator
      const currentIndicator = document.getElementById('current-team-indicator');
      if (!STATE.gameOver) {
        currentIndicator.classList.remove('hidden');
        const teamEl = currentIndicator.querySelector('div');
        const teamColor = STATE.currentTeam === 'red' ? 'bg-red-500 shadow-red-500/50' : 'bg-blue-500 shadow-blue-500/50';
        const currSize = isFs ? 'text-4xl md:text-6xl px-20 md:px-28 py-10 md:py-12' : 'text-2xl md:text-3xl px-12 md:px-16 py-6 md:py-8';
        teamEl.className = `font-black text-white ${currSize} rounded-3xl shadow-2xl ${teamColor}`;
        teamEl.textContent = `${STATE.currentTeam.toUpperCase()}'S TURN`;
      } else {
        currentIndicator.classList.add('hidden');
      }
      // Clue Section
      const clueSection = document.getElementById('clue-section');
      const cluePSize = isFs ? 'p-12 md:p-16' : 'p-8 md:p-12';
      clueSection.className = `bg-white/70 backdrop-blur-md rounded-3xl shadow-xl ${cluePSize} mb-12 max-w-2xl mx-auto ${STATE.mode === 'clue' || STATE.mode === 'guess' ? '' : 'hidden'}`;
      if (STATE.mode === 'clue') {
        clueSection.innerHTML = `
          <h2 class="text-3xl md:text-4xl lg:text-5xl font-bold text-gray-800 mb-12 text-center tracking-wide">Give a Clue</h2>
          <div class="flex flex-col lg:flex-row gap-8 items-end mb-12">
            <div class="flex-1">
              <label class="block text-lg md:text-xl font-semibold text-gray-700 mb-4">Number:</label>
              <select id="clue-num" class="w-full p-6 md:p-8 border-2 border-gray-300 rounded-3xl focus:border-blue-500 focus:ring-4 focus:ring-blue-200 text-2xl md:text-3xl font-bold tracking-wide">
                ${[1,2,3,4,5,6,7,8,9].map(n => `<option value="${n}">${n}</option>`).join('')}
              </select>
            </div>
            <div class="flex-1">
              <label class="block text-lg md:text-xl font-semibold text-gray-700 mb-4">Clue Word:</label>
              <input id="clue-word" type="text" class="w-full p-6 md:p-8 border-2 border-gray-300 rounded-3xl focus:border-blue-500 focus:ring-4 focus:ring-blue-200 text-2xl md:text-3xl font-bold uppercase tracking-widest" placeholder="e.g. FRUIT" maxlength="20" autocomplete="off">
            </div>
          </div>
          <button id="submit-clue-btn" class="w-full lg:w-auto px-16 py-8 bg-gradient-to-r from-purple-500 to-blue-600 hover:from-purple-600 hover:to-blue-700 text-white rounded-3xl shadow-2xl hover:shadow-3xl transition-all duration-300 font-bold text-2xl flex items-center gap-4 justify-center mx-auto">
            <i data-lucide="send"></i>
            Give Clue
          </button>
        `;
        document.getElementById('submit-clue-btn').onclick = submitClue;
      } else if (STATE.mode === 'guess') {
        clueSection.innerHTML = `
          <div class="text-center">
            <div class="text-5xl md:text-7xl lg:text-8xl font-black text-gray-900 mb-8 md:mb-12 tracking-widest">${STATE.clue.word} ${STATE.clue.num}</div>
            <p class="text-2xl md:text-3xl text-gray-600 font-semibold mb-12">Pass when ready</p>
            <button id="pass-btn" class="px-16 py-8 bg-gradient-to-r from-gray-500 to-gray-600 hover:from-gray-600 hover:to-gray-700 text-white rounded-3xl shadow-2xl hover:shadow-3xl transition-all duration-300 font-bold text-2xl flex items-center gap-4 mx-auto">
              <i data-lucide="skip-forward"></i>
              Pass Turn
            </button>
          </div>
        `;
        document.getElementById('pass-btn').onclick = passTurn;
      }
      // Grid Wrapper and Grid
      const gridWrapper = document.getElementById('grid-wrapper');
      const gridSize = isFs ? 'aspect-square mx-auto max-w-[92vw] max-h-[68vh] flex items-center justify-center' : 'w-full';
      gridWrapper.className = gridSize;
      const grid = document.getElementById('grid');
      const gridClass = isFs ? 'grid grid-cols-5 grid-rows-5 gap-2 md:gap-3 p-6 md:p-8 w-full h-full' : 'grid grid-cols-5 gap-3 md:gap-4 w-full h-auto';
      grid.className = gridClass;
      grid.innerHTML = '';
      for (let row = 0; row < 5; row++) {
        for (let col = 0; col < 5; col++) {
          const idx = row * 5 + col;
          const word = STATE.words[idx];
          const color = STATE.colors[idx];
          const revealed = STATE.revealed.has(idx);
          let classes = 'card col-span-1 row-span-1 flex items-center justify-center text-center font-bold cursor-pointer hover:shadow-xl transition-all duration-300 select-none border-2 border-transparent group rounded-2xl shadow-md overflow-hidden';
          let textClasses = 'text-gray-900 group-hover:text-gray-800 transition-colors';
          const textSize = isFs ? 'text-lg md:text-xl lg:text-2xl xl:text-3xl' : 'text-sm md:text-base lg:text-lg';
          textClasses += ` ${textSize}`;
          if (revealed) {
            classes = classes.replace('cursor-pointer hover:shadow-xl', 'cursor-default shadow-2xl scale-105 border-0');
            if (color === 'red') {
              classes += ' bg-red-500';
              textClasses = textClasses.replace('text-gray-900', 'text-white');
            } else if (color === 'blue') {
              classes += ' bg-blue-500';
              textClasses = textClasses.replace('text-gray-900', 'text-white');
            } else if (color === 'neutral') {
              classes += ' bg-amber-400';
              textClasses += ' font-black';
            } else { // assassin
              classes += ' bg-gray-800';
              textClasses = textClasses.replace('text-gray-900', 'text-white');
            }
          } else if (STATE.spyView) {
            if (color === 'red') {
              classes += ' bg-red-50 border-red-400/50 hover:border-red-500';
            } else if (color === 'blue') {
              classes += ' bg-blue-50 border-blue-400/50 hover:border-blue-500';
            } else if (color === 'neutral') {
              classes += ' bg-amber-50 border-amber-400/50 hover:border-amber-500';
            } else {
              classes += ' bg-gray-100 border-gray-400/50 hover:border-gray-500';
            }
          } else {
            classes += ' bg-white hover:bg-gray-50';
          }
          const card = document.createElement('div');
          card.className = classes;
          card.dataset.idx = idx;
          card.setAttribute('role', 'button');
          card.setAttribute('tabindex', revealed ? '-1' : '0');
          card.innerHTML = `<span class="${textClasses} px-2 py-1 md:px-3 md:py-2 select-none">${word}</span>`;
          grid.appendChild(card);
        }
      }
      // Update button states
      const spyBtn = document.getElementById('spy-toggle-btn');
      const fsSpyBtn = document.getElementById('fs-spy-toggle');
      const spyIcon = spyBtn?.querySelector('i') || fsSpyBtn?.querySelector('i');
      if (STATE.spyView) {
        if (spyBtn) spyBtn.innerHTML = '<i data-lucide="eye-off"></i> Guesser View';
        if (fsSpyBtn) fsSpyBtn.innerHTML = '<i data-lucide="eye-off" class="w-5 h-5"></i>';
        spyBtn?.classList.replace('bg-blue-500/80', 'bg-green-500/80');
      } else {
        if (spyBtn) spyBtn.innerHTML = '<i data-lucide="eye"></i> Spymaster View';
        if (fsSpyBtn) fsSpyBtn.innerHTML = '<i data-lucide="eye" class="w-5 h-5"></i>';
        spyBtn?.classList.replace('bg-green-500/80', 'bg-blue-500/80');
      }
      const fsIcon = document.getElementById('fullscreen-toggle-btn')?.querySelector('i');
      if (STATE.fullscreen) {
        document.getElementById('fullscreen-toggle-btn').innerHTML = '<i data-lucide="minimize-2"></i> Exit Fullscreen';
      } else {
        document.getElementById('fullscreen-toggle-btn').innerHTML = '<i data-lucide="maximize-2"></i> Fullscreen';
      }
      lucide.createIcons();
    }
    function handleGridClick(e) {
      const card = e.target.closest('.card[role="button"]');
      if (card && STATE.mode === 'guess' && !STATE.gameOver) {
        const idx = parseInt(card.dataset.idx);
        if (!STATE.revealed.has(idx)) {
          guess(idx);
        }
      }
    }
    function guess(idx) {
      STATE.revealed.add(idx);
      const color = STATE.colors[idx];
      const team = STATE.currentTeam;
      if (color === 'assassin') {
        STATE.winner = team === 'red' ? 'blue' : 'red';
        STATE.gameOver = true;
      } else if (color === team) {
        STATE.remaining[team]--;
        if (STATE.remaining[team] === 0) {
          STATE.winner = team;
          STATE.gameOver = true;
        }
      } else {
        passTurn();
        return;
      }
      render();
    }
    function passTurn() {
      STATE.currentTeam = STATE.currentTeam === 'red' ? 'blue' : 'red';
      STATE.mode = 'clue';
      STATE.clue = null;
      render();
    }
    function submitClue() {
      const num = parseInt(document.getElementById('clue-num').value);
      const word = document.getElementById('clue-word').value.trim().toUpperCase();
      if (!word || word.length < 2 || num < 1 || num > 9) {
        alert('Enter a valid clue: 2+ letters word and number 1-9.');
        return;
      }
      STATE.clue = { word, num };
      STATE.mode = 'guess';
      render();
    }
    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
        } else {
          await document.exitFullscreen();
        }
      } catch (err) {
        console.warn('Fullscreen API not supported:', err);
        alert('Fullscreen not supported on this browser/device.');
      }
    }
    function setupEventListeners() {
      document.getElementById('new-game-btn').onclick = newGame;
      document.getElementById('new-game-over-btn').onclick = newGame;
      document.getElementById('spy-toggle-btn').onclick = () => { STATE.spyView = !STATE.spyView; render(); };
      document.getElementById('fullscreen-toggle-btn').onclick = toggleFullscreen;
      document.getElementById('fs-spy-toggle').onclick = () => { STATE.spyView = !STATE.spyView; render(); };
      document.getElementById('fs-new-game').onclick = newGame;
      document.getElementById('fs-exit').onclick = toggleFullscreen;
      document.getElementById('grid').addEventListener('click', handleGridClick);
      // Keyboard for cards
      document.addEventListener('keydown', (e) => {
        if (STATE.mode !== 'guess' || STATE.gameOver || document.activeElement.tagName === 'INPUT') return;
        const focused = document.activeElement.closest('.card');
        if (!focused) return;
        let idx = parseInt(focused.dataset.idx);
        if (e.key === 'ArrowLeft') idx = Math.max(0, idx - 1);
        else if (e.key === 'ArrowRight') idx = Math.min(24, idx + 1);
        else if (e.key === 'ArrowUp') idx = Math.max(0, idx - 5);
        else if (e.key === 'ArrowDown') idx = Math.min(24, idx + 5);
        else if (e.key === 'Enter' || e.key === ' ') {
          if (!STATE.revealed.has(idx)) guess(idx);
          return;
        } else return;
        const targetCard = document.querySelector(`[data-idx="${idx}"]`);
        if (targetCard) {
          targetCard.focus();
          e.preventDefault();
        }
      });
    }
    function init() {
      newGame();
      setupEventListeners();
      document.addEventListener('fullscreenchange', () => {
        STATE.fullscreen = !!document.fullscreenElement;
        render();
      });
      window.addEventListener('orientationchange', () => setTimeout(render, 150));
      window.addEventListener('resize', () => setTimeout(render, 150));
    }
    init();
  </script>
</body>
</html>
